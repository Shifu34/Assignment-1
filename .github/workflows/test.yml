name: Run Unit Tests

on:
  workflow_dispatch:
  pull_request:
    branches: [ dev ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v2

    - name: Set up Python
      uses: actions/setup-python@v2
      with:
        python-version: '3.8'

    - name: Install Dependencies
      run: |
        pip install -r app/requirements.txt
        pip install pytest

    - name: Run Tests
      run: pytest tests/
